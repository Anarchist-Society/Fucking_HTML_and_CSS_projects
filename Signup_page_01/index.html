<!-- ============ DOCTYPE: le dice al navegador que esto es HTML5 ============ -->
<!doctype html>
<html lang="es">
  <!-- lang="es" indica que el contenido principal está en español para accesibilidad y SEO -->
  <head>
    <meta charset="UTF-8" />
    <!-- charset="UTF-8" permite usar caracteres especiales como tildes, ñ, emojis, etc. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El meta viewport hace que la página se vea bien en celulares (responsive design) -->
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="A fucking SignUp" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- Boxicons: librería de íconos traída desde un CDN (no necesitamos descargar nada) -->
    <link rel="stylesheet" href="style.css" />
    <!-- Enlazamos nuestro propio archivo CSS donde escribimos los estilos -->
    <title>SignUp Page 01</title>
  </head>

  <body>
    <!-- <main> = etiqueta semántica que agrupa el contenido principal de la página -->
    <main>
      <!-- .circle = círculo decorativo animado de fondo (solo estética, sin contenido real) -->
      <div class="circle" aria-hidden="true"></div>
      <!-- Para ocultar este elemento a los lectores de pantalla -->

      <!-- .card = contenedor tipo "tarjeta" blanco que agrupa el formulario -->
      <div class="card">
        <!-- .logo = ícono decorativo de Bitcoin dentro de un círculo -->
        <div class="logo" aria-hidden="true">
          <i class="bx bx-bitcoin"></i>
        </div>

        <!-- Título principal traducido a español -->
        <h1>Crear Cuenta</h1>

        <!-- <form> agrupa los inputs y los envía al servidor cuando se hace clic en el botón -->
        <!-- role="form" es para que los lectores de pantalla sepan que esto es un formulario -->
        <!-- aria-labelledby="form-title" significa que este formulario está etiquetado por el span con id form-title -->
        <form class="form" role="form" aria-labelledby="form-title">
          <span id="form-title" class="sr-only">Formulario de registro</span>

          <!-- input type="text" = campo de una sola línea. required = obligatorio. autocomplete = ayuda al navegador a rellenar -->
          <!-- Traducido a español -->
          <input
            id="name"
            type="text"
            name="name"
            autocomplete="name"
            required
            aria-required="true"
            placeholder="Nombre"
          />

          <!-- type="email" valida automáticamente que el texto tenga formato de correo (user@dominio.com) -->
          <!-- Traducido a español -->
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
            aria-required="true"
            placeholder="Correo electrónico"
          />

          <!-- type="password" oculta los caracteres escritos. minlength="8" exige al menos 8 caracteres -->
          <!-- Traducido a español -->
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="new-password"
            required
            aria-required="true"
            minlength="8"
            placeholder="Contraseña"
          />

          <!-- type="submit" = al hacer clic envía el formulario. "REGISTRARSE" en mayúsculas es decisión de diseño -->
          <!-- Traducido a español -->
          <button type="submit">REGISTRARSE</button>
        </form>

        <!-- footer con enlace descriptivo para "usuarios existentes" (href="#" es un placeholder, aún no lleva a ninguna parte) -->
        <!-- "Inicia sesión" es más descriptivo que solo un "Aquí" suelto, mejorando accesibilidad y SEO -->
        <footer>
          ¿Ya tienes cuenta?
          <a href="#">Inicia sesión</a>
        </footer>
      </div>
    </main>
  </body>
</html>
